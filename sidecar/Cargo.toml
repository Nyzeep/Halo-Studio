[workspace]
resolver = "2"
members = [
    "crates/halo-protocol",
    "crates/halo-core",
    "crates/halo-config",
    "crates/halo-store",
    "crates/halo-runtime",
    "crates/halo-sidecar",
    "crates/halo-testkit",
    "crates/halo-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

# 所有 crate 一律从这里继承版本，禁止私自引入重复依赖（docs/module-contracts.md 第 0 节）
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "serde-well-known"] }
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.10", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }
tiny_http = "0.12"
sha2 = "0.10"
similar = "2"
tempfile = "3"
crossbeam-channel = "0.5"

halo-protocol = { path = "crates/halo-protocol" }
halo-core = { path = "crates/halo-core" }
halo-config = { path = "crates/halo-config" }
halo-store = { path = "crates/halo-store" }
halo-runtime = { path = "crates/halo-runtime" }
halo-testkit = { path = "crates/halo-testkit" }

[profile.dev]
debug = 1
