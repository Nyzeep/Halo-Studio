[package]
name = "halo-acp"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Halo Agent Client Protocol surface"

[lib]
name = "halo_acp"

[dependencies]
halo-core = { path = "../../assembly/core", default-features = false, features = ["product-full"] }
halo-agent-runtime = { path = "../../execution/agent-runtime" }
halo-agent-tools = { path = "../../execution/tool-contracts" }
halo-events = { path = "../../contracts/events" }
halo-core-types = { path = "../../contracts/core-types" }

agent-client-protocol = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
