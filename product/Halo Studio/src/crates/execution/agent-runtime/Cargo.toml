[package]
name = "halo-agent-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Agent runtime contracts and owner decisions for Halo"

[lib]
name = "halo_agent_runtime"
crate-type = ["rlib"]

[features]
default = []

[dependencies]
async-trait = { workspace = true }
halo-agent-stream = { path = "../agent-stream" }
halo-agent-tools = { path = "../tool-contracts" }
halo-core-types = { path = "../../contracts/core-types" }
halo-events = { path = "../../contracts/events" }
halo-harness = { path = "../harness" }
halo-runtime-ports = { path = "../../contracts/runtime-ports", features = ["permission"] }
halo-runtime-services = { path = "../runtime-services" }
dashmap = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
