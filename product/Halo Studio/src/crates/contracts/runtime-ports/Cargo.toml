[package]
name = "halo-runtime-ports"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Thin runtime ports for Halo core decomposition"

[lib]
name = "halo_runtime_ports"
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
halo-product-domains = { path = "../product-domains", default-features = false, optional = true }
halo-core-types = { path = "../core-types" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[features]
default = []
permission = ["dep:halo-product-domains"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
