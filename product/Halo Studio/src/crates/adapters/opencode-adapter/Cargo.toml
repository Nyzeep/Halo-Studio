[package]
name = "halo-opencode-adapter"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenCode-compatible source and candidate adapter for Halo"

[lib]
name = "halo_opencode_adapter"
crate-type = ["rlib"]

[dependencies]
async-trait = { workspace = true }
halo-plugin-runtime-client = { path = "../../execution/plugin-runtime-client" }
halo-product-domains = { path = "../../contracts/product-domains", default-features = false, features = ["external-sources", "plugin-source"] }
halo-runtime-ports = { path = "../../contracts/runtime-ports" }
halo-services-core = { path = "../../services/services-core", default-features = false, features = ["markdown"] }
halo-static-hook-support = { path = "../static-hook-support" }
dirs = { workspace = true }
dunce = { workspace = true }
hex = { workspace = true }
oxc-parse = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
urlencoding = { workspace = true }
url = { workspace = true }

[dev-dependencies]
halo-services-integrations = { path = "../../services/services-integrations", default-features = false, features = ["plugin-source", "script-tool-runtime"] }
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
