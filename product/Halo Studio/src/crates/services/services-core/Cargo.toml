[package]
name = "halo-services-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Halo core service owner crate"

[lib]
name = "halo_services_core"
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
halo-core-types = { path = "../../contracts/core-types" }
halo-events = { path = "../../contracts/events" }
halo-runtime-ports = { path = "../../contracts/runtime-ports", optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
base64 = { workspace = true }
chrono = { workspace = true }
git2 = { workspace = true }
dunce = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
thiserror = { workspace = true }
log = { workspace = true }
fs2 = { workspace = true }
notify = { workspace = true, optional = true }
ignore = { workspace = true }
sha2 = { workspace = true }
which = { workspace = true }
similar = { workspace = true }
regex = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[target.'cfg(windows)'.dependencies]
win32job = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

# Keep libgit2 self-contained on Unix, matching the product assembly dependency.
[target.'cfg(not(windows))'.dependencies]
git2 = { workspace = true, features = ["vendored-openssl"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = ["lsp"]
lsp = ["dep:anyhow", "dep:notify", "dep:zip"]
markdown = ["dep:serde_yaml"]
workspace-runtime = ["dep:anyhow", "dep:async-trait", "dep:halo-runtime-ports", "dep:dunce"]
managed-event-facts = ["dep:halo-runtime-ports"]
runtime-ownership = ["dep:dunce"]
permission = ["dep:async-trait", "dep:halo-runtime-ports", "dep:rusqlite", "halo-runtime-ports/permission"]

[dev-dependencies]
filetime = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "markdown_owner_contracts"
required-features = ["markdown"]

[[test]]
name = "lsp_plugin_registry_contracts"
required-features = ["lsp"]

[[test]]
name = "runtime_ownership_contracts"
required-features = ["runtime-ownership"]

[[test]]
name = "session_write_lock_contracts"

[lints]
workspace = true
