[package]
name = "halo-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Halo CLI - Terminal User Interface"
default-run = "halo"
autobins = false

[[bin]]
name = "halo"
path = "src/main.rs"

[[bin]]
name = "halo-cli"
path = "src/bin/halo_cli_compat.rs"

[dependencies]
# Internal crates
halo-core = { path = "../../crates/assembly/core", default-features = false, features = ["product-full"] }
halo-events = { path = "../../crates/contracts/events" }
halo-acp = { path = "../../crates/interfaces/acp" }
halo-agent-runtime = { path = "../../crates/execution/agent-runtime" }
halo-agent-runtime-ipc = { path = "../../crates/adapters/agent-runtime-ipc" }
halo-runtime-ports = { path = "../../crates/contracts/runtime-ports" }
halo-runtime-services = { path = "../../crates/execution/runtime-services" }
halo-services-core = { path = "../../crates/services/services-core", default-features = false, features = ["runtime-ownership"] }
halo-agent-tools = { path = "../../crates/execution/tool-contracts" }
halo-product-domains = { path = "../../crates/contracts/product-domains", default-features = false, features = ["external-sources"] }

# CLI framework
clap = { workspace = true }

# TUI framework (Terminal User Interface)
ratatui = { workspace = true }
crossterm = { workspace = true }

# Config and serialization
dirs = { workspace = true }
toml = { workspace = true }

# Session management
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }

# Async trait
async-trait = { workspace = true }

# Unicode width calculation (for correct wide-char handling)
unicode-width = { workspace = true }

# Path canonicalization without Windows UNC prefix
dunce = { workspace = true }

# Markdown parsing and rendering
pulldown-cmark = { workspace = true }

# Diff computation for tool card rendering
similar = { workspace = true }

# Syntax highlighting for code blocks and tool cards
syntect = { workspace = true }
syntect-tui = { workspace = true }

# Lazy initialization for syntax highlighter singleton
once_cell = { workspace = true }

# Unix-only best-effort terminal color detection (OSC 11)
libc = { workspace = true }

# Clipboard access (for reliable paste on Windows where bracketed paste is broken)
arboard = { workspace = true }

# Inherited from workspace
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
minisign-verify = "0.2"
reqwest = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = "3"

[dev-dependencies]
hex = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

# portable-pty: ohos requires 0.9 (nix 0.25 is incompatible); all other
# platforms use 0.8 to avoid the PSEUDOCONSOLE_INHERIT_CURSOR ConPTY bug.
[target.'cfg(not(target_env = "ohos"))'.dev-dependencies]
portable-pty = { workspace = true }

[target.'cfg(target_env = "ohos")'.dev-dependencies]
portable-pty = "0.9"

[features]
default = []

[lints]
workspace = true
