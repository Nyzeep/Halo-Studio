[package]
name = "halo-tauri-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Halo Studio local coding workbench (Tauri)"

[[bin]]
name = "halo-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
bitfun-desktop = { path = "../desktop", default-features = false, features = ["halo-local-coding"] }
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true

[features]
default = []
devtools = ["tauri/devtools", "bitfun-desktop/devtools"]
