[package]
edition = "2021"
rust-version = "1.90"
name = "tauri-utils"
version = "2.9.3"
authors = ["Tauri Programme within The Commons Conservancy"]
build = false
exclude = [
    "CHANGELOG.md",
    "/target",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Utilities for Tauri"
homepage = "https://tauri.app/"
