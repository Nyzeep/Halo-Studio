id = "pi"
name = "Pi Agent"
provider = "inflection"
transport = "pty"
command = "pi"
description = "Pi local CLI agent profile for Halo Studio."
capabilities = ["chat", "thinking", "tool", "mcp"]

[permissions]
shell = false
file_read = true
file_write = false
mcp = true
network = false

[[commands]]
name = "/pi"
description = "Switch composer context to Pi Agent."
args = ["--continue", "--model"]

[[commands]]
name = "/help"
description = "Show available Halo Studio commands."
args = ["--agent", "--mcp"]
