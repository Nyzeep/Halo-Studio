id = "claude-code"
name = "Claude Code"
provider = "anthropic"
transport = "pty"
command = "claude"
description = "Claude Code local CLI agent profile for Halo Studio."
capabilities = ["chat", "thinking", "tool", "shell", "diff", "mcp", "approval"]

[permissions]
shell = false
file_read = true
file_write = false
mcp = true
network = false

[[commands]]
name = "/claude"
description = "Switch composer context to Claude Code."
args = ["--continue", "--resume", "--permission", "--model"]

[[commands]]
name = "/review"
description = "Ask the current agent to review pending changes."
args = ["--scope", "--strict"]
