id = "codex-cli"
name = "Codex CLI"
provider = "openai"
transport = "pty"
command = "codex"
description = "Codex CLI local agent profile for Halo Studio."
capabilities = ["chat", "thinking", "tool", "shell", "diff", "mcp", "approval"]

[permissions]
shell = false
file_read = true
file_write = false
mcp = true
network = false

[[commands]]
name = "/codex"
description = "Switch composer context to Codex CLI."
args = ["--continue", "--model", "--sandbox", "--approval"]

[[commands]]
name = "/test"
description = "Ask Codex CLI to run or inspect tests."
args = ["--target", "--watch"]
