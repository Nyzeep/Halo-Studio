id = "opencode"
name = "OpenCode"
provider = "opencode"
transport = "pty"
command = "opencode"
description = "OpenCode local CLI agent profile for Halo Studio."
capabilities = ["chat", "thinking", "tool", "shell", "diff", "mcp"]

[permissions]
shell = false
file_read = true
file_write = false
mcp = true
network = false

[[commands]]
name = "/opencode"
description = "Switch composer context to OpenCode."
args = ["--continue", "--model", "--permission"]

[[commands]]
name = "/run"
description = "Ask the active agent to prepare a run plan."
args = ["--dry-run", "--profile"]
