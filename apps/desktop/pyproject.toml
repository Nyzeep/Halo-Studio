[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-desktop"
version = "0.1.0"
description = "Halo Studio native desktop shell"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["halo_desktop*"]

[tool.setuptools.package-data]
halo_desktop = ["qml/**/*.qml"]
